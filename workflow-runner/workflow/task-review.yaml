name: "Task 评审"
description: "OpenCode 实现单张 Task（一 Task 一 PR）后触发：开始评审先把 Jira 流转到 In Review → 拉 PR 并把 diff 落文件 → DoD 门（只看证据不读 diff，坏构建零成本打回）→ 合并评审（diff 只读一次）+ 安全/性能按风险自适应深审或跳过 → 汇总判定 → GitHub 发布完整 review comment → Jira 只写最小回链评论并流转 Reviewed / Reopened。"

# HARD RULES
# - 所有面向用户 / Jira / GitHub 的正文输出必须为中文，除非 step 明确要求英文短字段
# - 不得把模板化 markdown 改写为自由 prose 风格
# - 每个 step 若定义了 output，则必须有对应本地产物文件；缺失任一产物视为 workflow 失败
# - summary step 只能产出 final_review；write_back step 必须直接产出发往 Jira 的最小中文正文
# - 结束前必须运行 scripts/validate-task-review-output.ps1；validator 未通过不得宣称 workflow 完成
# - 本 workflow 只允许把 Jira 流转到 In Review / Reopened / Reviewed

agents_dir: "vendor/agency-agents-zh"

llm:
  provider: deepseek
  model: deepseek-chat
  max_tokens: 4096

concurrency: 3

inputs:
  - name: story_key
    description: "本次评审的 Jira Task Issue Key（如 EMT-54）"
    required: true
  - name: pr_url
    description: "该 Task 对应的 GitHub PR URL（如 https://github.com/jadephong/BasePortal/pull/8），分支约定 feature/<story_key>"
    required: true
  - name: cloud_id
    description: "Jira 站点（如 jadephong.atlassian.net）"
    required: false
    default: "jadephong.atlassian.net"
  - name: review_round
    description: "当前评审轮次（同一 Task 第几次 review）"
    required: false
    default: "1"
  - name: max_rounds
    description: "同一 Task 最多返修轮次，超过则升级人工介入"
    required: false
    default: "10"
  - name: context_mode
    description: "full = 全量 diff（第 1 轮）；incremental = 只看 last_reviewed_sha..HEAD（第 2 轮起）"
    required: false
    default: "full"
  - name: last_reviewed_sha
    description: "增量基线 SHA，context_mode=incremental 时必传；full 模式下忽略"
    required: false
    default: ""
  - name: jira_content
    description: "Jira issue description 字段（由 n8n Jira node 预取后传入，ADF JSON 字符串）；非空时跳过内部 getJiraIssue 调用"
    required: false
    default: ""

steps:
  - id: gather_context
    role: "engineering/engineering-devops-automator"
    task: |
      汇集评审数据，并把**大件落文件**——diff 不要内联进上下文，省后续步骤反复重注入的 token。

      ## 目标
      - Task：{{story_key}} ｜ PR：{{pr_url}} ｜ Jira 站点：{{cloud_id}}

      执行：
      1. **PR 元数据**：`gh pr view <编号> --repo <owner/repo> --json number,title,body,state,additions,deletions,changedFiles,headRefName,baseRefName`
         （编号取 pr_url 末段，owner/repo 从 URL 解析）。
      2. **diff 落文件**：
         - 若 `{{context_mode}}` 为 `incremental` 且 `{{last_reviewed_sha}}` 非空：
           `gh pr diff <编号> --repo <owner/repo> --base {{last_reviewed_sha}}` — 只取增量变化
         - 否则（full 模式）：`gh pr diff <编号> --repo <owner/repo>` — 全量 diff
         完整输出写入 `.ao-output/review-{{story_key}}/diff.patch`，**不要把 diff 正文放进本步骤输出**。
      3. **Jira 验收基准**：
         - 若 `{{jira_content}}` 非空，直接解析该内容（ADF JSON 格式：递归提取 `type=text` 节点的 `text` 字段拼接为纯文本）获取 AC 与 Tech Spec；
         - 否则调用 `getJiraIssue`（cloudId={{cloud_id}}, issueIdOrKey={{story_key}}, responseContentFormat=markdown）。
         只取与本 PR 相关的 AC / Tech Spec 要点，无关内容不要堆进来。

      输出「评审上下文（精简）」——**不含 diff 正文**，包含：
      - PR 元数据、分支名是否符合 `feature/{{story_key}}`、标题/描述是否对应该 Task
      - 该 Task 的 AC 与相关 Tech Spec 要点
      - **DoD 证据**：PR 自报的测试/lint/typecheck 结果原文
      - **diff 统计**：变更文件清单 + 各文件 +/- 行数 + 总变更规模
      - **风险分类**（供下游自适应判断，逐项给 是/否 + 命中点）：
        · 安全敏感面：鉴权/授权、支付、PII/敏感数据、加密、外部输入/反序列化、文件上传、SQL/DB 迁移、越权面
        · 性能敏感面：循环/批处理、DB 查询/N+1、大数据量、热路径、并发
        · 规模等级：small（<~200 改动行）/ medium / large（>~400 行或多文件）
      - diff 文件路径：`.ao-output/review-{{story_key}}/diff.patch`
      - context_mode：{{context_mode}}（incremental 时基线 SHA：{{last_reviewed_sha}}）

      若 gh / Jira MCP 不可用，停止并提示先登录 gh / 连接 Atlassian。
    output: review_context

  - id: dod_gate
    role: "engineering/engineering-code-reviewer"
    task: |
      DoD 守门员。**只看证据，不读 diff 文件**——坏构建要在花 diff token 之前就拦下。

      ## 评审上下文（精简，含 DoD 证据与 diff 统计）
      {{review_context}}

      核验并输出「DoD 核验结果」：
      1. **测试通过**：有无真实测试运行证据且全绿？（"已测试"不算，要看具体结果）
      2. **Lint/构建/类型检查**：干净通过？
      3. **AC 勾选**：每条 AC 是否都声明了对应实现/测试位置？列未覆盖项。
      4. **变更聚焦**：从 diff 统计看，是否聚焦本 Task（无明显夹带无关文件/异常规模）。

      结论二选一：
      - ✅ 证据齐全 → 放行实质评审
      - ❌ 证据不足（列缺项）→ **本轮直接判定打回**，并立即执行以下文件写入（不等后续步骤）：
        1. `mkdir -p .ao-output/review-{{story_key}}`
        2. 写 `.ao-output/review-{{story_key}}/final_review-round{{review_round}}.md`，内容为：
           ```
           ### 判定：🔁 打回
           DoD 核验失败，缺项：<列出缺项>
           ### 必须修改（🔴 Blocking）
           <列出每条缺项>
           ### 建议改进（🟡 Non-blocking）
           无
           ### 亮点
           无
           ```
        3. 写 `.ao-output/review-{{story_key}}/review-result.json`，内容为：
           ```json
           {
             "status": "fail",
             "review_round": {{review_round}},
             "story_key": "{{story_key}}",
             "pr_url": "{{pr_url}}",
             "blocking_findings": [{"id":"D1","description":"<缺项摘要>"}],
             "github_comment_body": "<final_review md 完整内容>",
             "jira_transition_to": "Reopened"
           }
           ```
        两个文件写完后输出 dod_result 结论，workflow 可继续（后续步骤将跳过）。
    depends_on: [gather_context]
    output: dod_result

  - id: review
    role: "engineering/engineering-code-reviewer"
    task: |
      基线合并评审（一定执行）。**diff 文件只读这一次**，质量/正确性/AC 一遍过完，避免多步重复注入 diff。

      ## DoD 核验结果
      {{dod_result}}
      ## 评审上下文（精简，含 AC/Spec、diff 路径）
      {{review_context}}

      若 DoD ❌：输出「🔁 DoD 未通过，跳过代码审查，本步骤结论：打回」，**不读 diff**，完成本步骤并输出该结论。
      若 DoD ✅：读 `.ao-output/review-{{story_key}}/diff.patch` 一次，对照 AC 与 Tech Spec 做合并评审：
      1. **AC 逐条核对**：每条 → ✅满足 / ❌未满足（附定位）
      2. **Spec 符合度**：是否偏离接口契约/数据模型/实现步骤/异常处理
      3. **代码质量与可维护性**：命名、复杂度、重复、项目约定
      4. **逻辑正确性**：边界、错误处理、潜在 bug
      5. **测试质量**：是否真覆盖 AC，有无假绿（断言空泛/过度 mock）
      6. **范围核对**：有无做 Spec 之外或漏做

      每条标注 🔴 阻塞 / 🟡 建议 / ✅ 通过，给具体改法。只输出结论与发现，**不要回贴 diff 大段原文**。
    depends_on: [dod_gate]
    output: quality_report

  - id: security_check
    role: "engineering/engineering-security-engineer"
    task: |
      安全评审——**按风险自适应**：不碰安全敏感面就不读 diff、轻量跳过；碰了才深审。

      ## DoD 核验结果
      {{dod_result}}
      ## 评审上下文（精简，含风险分类、diff 路径）
      {{review_context}}

      判断：
      - 若 DoD ❌：输出「🔁 DoD 未通过，跳过安全审查，本步骤结论：打回」，完成本步骤并输出该结论。
      - 若风险分类中**安全敏感面全部为否**：输出「✅ 未触及安全敏感面，跳过深审（依据：<列出判断点>）」，
        **不读 diff 文件**，完成本步骤。
      - 若命中任一安全敏感面：读 `.ao-output/review-{{story_key}}/diff.patch`，**只针对命中的面**做深审：
        注入（SQL/XSS/命令）、认证授权/越权、敏感数据加密与日志泄露、依赖漏洞、硬编码密钥/不安全配置。
        每个问题标 🔴高/🟡中/🟢低 + 修复建议。
    depends_on: [dod_gate]
    output: security_report

  - id: perf_check
    role: "testing/testing-performance-benchmarker"
    task: |
      性能评审——**按风险自适应**：不碰性能敏感面就不读 diff、轻量跳过；碰了才深审。

      ## DoD 核验结果
      {{dod_result}}
      ## 评审上下文（精简，含风险分类、diff 路径）
      {{review_context}}

      判断：
      - 若 DoD ❌：输出「🔁 DoD 未通过，跳过性能审查，本步骤结论：打回」，完成本步骤并输出该结论。
      - 若风险分类中**性能敏感面全部为否**（如纯 docs/config/文案改动）：
        输出「✅ 未触及性能敏感面，跳过深审（依据：<列出判断点>）」，**不读 diff 文件**，完成本步骤。
      - 若命中任一性能敏感面：读 `.ao-output/review-{{story_key}}/diff.patch`，**只针对命中的面**做评审：
        算法复杂度、资源管理、并发竞态/死锁、N+1/重复 I/O、缺失缓存。
        每个问题标 🔴高/🟡中/🟢低 + 优化建议。
    depends_on: [dod_gate]
    output: perf_report

  - id: summary
    role: "engineering/engineering-code-reviewer"
    task: |
      综合各维度给最终判定。安全/性能若标注为"跳过深审"，视为该维度无阻塞。

      ## DoD 核验结果
      {{dod_result}}
      ## 基线评审
      {{quality_report}}
      ## 安全评审
      {{security_report}}
      ## 性能评审
      {{perf_report}}

      输出（markdown）：
      ### 判定：[✅ 通过 / 🔁 打回 / ⛔ 升级]
      （任何发现（🔴 阻塞或 🟡 建议）或 DoD ❌ → 打回，🟡 项也必须修复后才能通过；{{review_round}} ≥ {{max_rounds}} 仍未通过 → 升级）

      ### 评审覆盖
      | 维度 | 是否深审 | 结论 | 关键发现 |
      |------|---------|------|---------|
      | 基线(质量/正确/AC) | 是 | | |
      | 安全 | 是/跳过 | | |
      | 性能 | 是/跳过 | | |

      ### 必须修改（🔴 Blocking）
      1. [维度] 问题 → 定位 → 具体改法

      ### 建议改进（🟡 Non-blocking）
      ### 亮点

      本步骤本地产物与格式硬约束：
      1. **无论 DoD 通过与否，本步骤必须完成并写入产物文件**，这是 workflow 正常结束的前提。
      2. 写文件前先执行 `mkdir -p .ao-output/review-{{story_key}}`。
      3. 唯一本地产物文件名必须为 `.ao-output/review-{{story_key}}/final_review-round{{review_round}}.md`
      4. 必须严格遵循模板 `vendor/workflows/templates/task-review/final_review.md`
      5. 必须保留以上标题与评审覆盖表格，禁止改写为 prose 风格
      6. 必须为中文
    depends_on: [review, security_check, perf_check]
    output: final_review

  - id: produce_result
    role: "engineering/engineering-devops-automator"
    task: |
      从 final_review 文件提取结构化评审结果，写入 review-result.json 供 n8n 编排层读取。

      ## 最终评审
      {{final_review}}

      执行：
      1. 执行 `mkdir -p .ao-output/review-{{story_key}}`（确保目录存在）。
      2. 读取 `.ao-output/review-{{story_key}}/final_review-round{{review_round}}.md` 的完整内容。
      3. 解析判定行 `### 判定：`，提取结论：
         - 含 `✅ 通过` → status: "pass"，jira_transition_to: "Reviewed"
         - 含 `🔁 打回` → status: "fail"，jira_transition_to: "Reopened"
         - 含 `⛔ 升级` → status: "escalate"，jira_transition_to: "Reopened"
         - 找不到判定行 → status: "fail"，jira_transition_to: "Reopened"
      4. 提取 `### 必须修改` 下的阻塞项列表（编号行），每条生成 `{"id":"R1","description":"..."}`；无阻塞项则为空数组。
      5. 将文件完整内容作为 github_comment_body。
      6. **必须**写入 `.ao-output/review-{{story_key}}/review-result.json`，格式如下（字段名完整，不得缺失）：
         ```json
         {
           "status": "pass|fail|escalate",
           "review_round": {{review_round}},
           "story_key": "{{story_key}}",
           "pr_url": "{{pr_url}}",
           "blocking_findings": [],
           "github_comment_body": "<final_review 文件完整内容>",
           "jira_transition_to": "Reviewed|Reopened"
         }
         ```
      7. 输出：review-result.json 的路径与 status 值。

      **硬约束：本步骤必须完成文件写入，这是 n8n 编排层读取结果的唯一来源。若 final_review 文件不存在，以 status="fail" 写入最小合法 JSON。**
    depends_on: [summary]
    output: result_json
