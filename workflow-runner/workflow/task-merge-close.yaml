name: "Task 合并与关单"
description: "评审通过后独立触发：合并前置门（确认 review passed + PR 可合并 + 抓取测试摘要）→ 合并 PR 到 main → 把 Jira 流转到 Done → 评论四要素（Jira Link / 改动摘要 / developer 测试 / QA 自动化测试 + PR Link）。与 task-development.yaml / task-fix-review.yaml 配套，二者之间是评审硬边界。"

# HARD RULES
# - 所有面向用户 / Jira / GitHub 的正文输出必须为中文
# - preflight 未通过禁止进入 merge_and_close
# - merge 后必须回读验证 PR merged / Jira status / Jira comment 三项
# - 结束前必须运行 scripts/validate-task-merge-close-output.ps1

agents_dir: "vendor/agency-agents-zh"

llm:
  provider: deepseek
  model: deepseek-chat
  max_tokens: 4096

concurrency: 1

inputs:
  - name: jira_id
    description: "要关闭的 Jira Task Key（如 EMT-50），须与 PR 对应"
    required: true
  - name: pr_url
    description: "已评审通过、待合并的 PR URL（分支应为 feature/<jira_id>）"
    required: true
  - name: repo
    description: "GitHub 仓库 owner/repo"
    required: false
    default: "jadephong/BasePortal"
  - name: cloud_id
    description: "Jira 站点"
    required: false
    default: "jadephong.atlassian.net"
  - name: merge_method
    description: "合并方式：squash / merge / rebase"
    required: false
    default: "squash"

steps:
  - id: preflight
    role: "engineering/engineering-git-workflow-master"
    task: |
      合并前置门：只做核对与取数，绝不合并。

      ## 目标
      - Jira：{{jira_id}}
      - PR：{{pr_url}}
      - 仓库：{{repo}}

      执行：
      1. **确认评审通过**：用 `gh pr view <编号> --repo {{repo}} --json reviewDecision,mergeable,state,headRefName,title,body`
         核对：reviewDecision 是否 APPROVED、state 是否 OPEN、mergeable 是否可合并（无冲突）。
      2. **分支约定核对**：headRefName 是否为 `feature/{{jira_id}}`，PR 是否确为该 Task。
      3. **CI 状态**：`gh pr checks <编号> --repo {{repo}}` 确认检查全绿。
      4. **抓取关单素材**（从 PR body 提取，供下一步写 Jira 评论）：
         改动摘要、Files touched、developer 测试结果、QA 自动化测试结果。

      <HARD-GATE>
      若 reviewDecision 非 APPROVED / PR 已关闭 / 不可合并 / CI 未过：
      判定 ❌，停止并说明原因（如需返修，走 task-fix-review.yaml），**禁止进入合并步骤**。
      全部满足才输出 ✅ 与抓取到的关单素材。
      </HARD-GATE>
    output: preflight_result

  - id: merge_and_close
    role: "engineering/engineering-git-workflow-master"
    task: |
      前置：preflight 必须为 ✅。若为 ❌，立即停止。

      ## 前置核对结果（含关单素材）
      {{preflight_result}}

      执行：
      1. **合并 PR 到 main**：`gh pr merge <编号> --repo {{repo}} --{{merge_method}}`。
         确认合并成功，记录合并 commit。
      2. **Transition Jira to Done**：用 Atlassian MCP（cloudId={{cloud_id}}）将 {{jira_id}}
         流转到 `Done`。
      3. **Jira 评论**（`addCommentToJiraIssue`），必须包含以下要素：
         - **Jira Link**：https://{{cloud_id}}/browse/{{jira_id}}
         - **PR Link**：{{pr_url}}
         - **改动摘要**：本 Task 做了什么、动了哪些文件
         - **Developer 测试结果**：通过明细
         - **QA 自动化测试结果**：通过数/总数
      4. 输出：合并结果（合并 commit）、Jira 新状态、评论链接。

      <HARD-GATE>未经 preflight 确认评审通过，不得合并、不得把 Jira 流转到 `Done`。</HARD-GATE>
      本步骤本地产物与格式硬约束：
      1. Jira 关单评论必须严格遵循模板 `vendor/workflows/templates/task-merge-close/jira_close_comment.md`
      2. 本工作流结束前必须通过 `scripts/validate-task-merge-close-output.ps1`
    depends_on: [preflight]
    output: close_result