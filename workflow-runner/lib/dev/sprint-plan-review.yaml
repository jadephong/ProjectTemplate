name: "Sprint 规划与评审"
description: "grill-me 需求对齐 → Scrum 拆 Sprint 任务 → 逐 Story 用 grill-me 对齐并以 to-prd 结构定稿 → 架构师写 Tech Spec → Spec 覆盖/歧义校验 → 输出待审批包并强制暂停等用户 Review。全程产物只落本地 .ao-output，零 Jira 写入；批准后请运行 sprint-jira-sync.yaml 同步 Jira（含建 Epic 串联 Story）。适用于任意 Sprint。"

# HARD RULES
# - 所有面向用户的正文输出必须为中文
# - 逐 Story grill 与逐 Story 落盘是强约束；不得用聊天总结替代本地产物
# - 本工作流严禁任何 Jira / Atlassian 写操作；一旦写入即视为 workflow 失败
# - 结束前必须运行 scripts/validate-sprint-plan-review-output.ps1

agents_dir: "vendor/agency-agents-zh"

llm:
  provider: deepseek
  model: deepseek-chat
  max_tokens: 4096

concurrency: 1

inputs:
  - name: sprint_name
    description: "Sprint 标识（如 Sprint 1、Sprint 2026-W22、迭代 3），用于命名与 Story 临时 ID 前缀"
    required: false
    default: "当前 Sprint"
  - name: sprint_goal
    description: "本 Sprint 目标 / 要交付的功能范围（如：完成租户管理与登录鉴权）"
    required: true
  - name: backlog
    description: "已有的 backlog / 需求清单 / PRD 链接或正文（来自上一 Sprint 产物）"
    required: false
    default: "无现成 backlog，请基于 Sprint 目标推导"
  - name: tech_context
    description: "技术背景（技术栈、已有架构、约束等）"
    required: false
    default: "沿用 BasePortal 现有技术栈与架构"
  - name: jira_project
    description: "目标 Jira 项目 Key（如 BP），仅用于在同步预案中标注，本工作流不写 Jira"
    required: false
    default: "待定"
  - name: capacity
    description: "团队产能（人数 × 可用人天，用于校验 Sprint 是否塞得下）"
    required: false
    default: "未提供，按合理假设估算并标注"
  - name: prev_sprint_review
    description: "上个 Sprint 的 sprint-review.yaml 验收报告（carryover、实际vs计划估点、技术债/跟进项、复盘教训），用于估点校准与避免重踩坑"
    required: false
    default: "无（首个 Sprint 或未提供上轮复盘）"

steps:
  - id: requirement_alignment
    role: "product/product-manager"
    task: |
      在拆任务之前，先用 grill-me 方法论把「{{sprint_name}}」的需求和你对齐——
      盲目拆一堆基于错误理解的 Task 是这条流水线最大的浪费来源。

      ## 待对齐的 Sprint 目标
      {{sprint_goal}}

      ## 现有 Backlog / 需求
      {{backlog}}

      ## 上个 Sprint 复盘（carryover / 估点偏差 / 技术债 / 教训）
      {{prev_sprint_review}}

      执行方式（遵循 grill-me skill）：
      1. **一次只问一个问题**，沿需求决策树逐个分支往下走，按依赖顺序逐一敲定。
      2. **每个问题都给出你推荐的答案**（基于产品判断），让用户确认或纠正，而非开放式空问。
      3. **能从代码库/现有产物查到的，先自己查**（读 PRD、上一 Sprint 产物、`docs/adr/` 决策日志、代码），不要拿已知信息问用户。
      4. **先消化上个 Sprint 复盘**：把 carryover 项作为本 Sprint 候选、用估点偏差校准、把上轮踩的坑作为这次要避开的约束。
      5. 重点逼问这些容易留坑的地方：
         - Sprint 目标的成功判据到底是什么（怎样算"做到了"）
         - 范围边界：明确哪些做、哪些这个 Sprint 不做
         - 隐含假设、依赖的外部条件、未定的产品取舍
         - 用户/业务优先级冲突时怎么排序

      <HARD-GATE>
      持续追问直到达成共识，不要急着进入拆解。每轮把"已确认 / 仍待定"两栏更新给用户看。
      仍有影响拆解的关键分歧未解决时，不得进入 sprint_planning。
      </HARD-GATE>

      对齐完成后输出「需求对齐纪要」：
      1. **已对齐的 Sprint 目标与成功判据**（替代原始模糊目标）
      2. **明确的范围边界**（做 / 不做）
      3. **已敲定的关键决策**（问题 → 最终结论 → 理由）
      4. **遗留假设与风险**（已知但本 Sprint 接受的不确定性）
    output: aligned_requirements

  - id: sprint_planning
    role: "project-management/project-manager-senior"
    task: |
      你是「{{sprint_name}}」的规划负责人。请基于已对齐的需求纪要，把 Sprint 目标拆解为可独立交付、可估算的任务。

      ## 需求对齐纪要（grill-me 对齐后的权威基准，优先于下方原始输入）
      {{aligned_requirements}}

      ## 原始 Sprint 目标（{{sprint_name}}）
      {{sprint_goal}}

      ## 现有 Backlog / 需求
      {{backlog}}

      ## 团队产能
      {{capacity}}

      ## 上个 Sprint 复盘（估点校准与 carryover 来源）
      {{prev_sprint_review}}

      请输出 Sprint Backlog（估点时参考上轮实际偏差校准，优先纳入未完成的 carryover 项）：
      1. **Sprint 目标复述**（一句话锚定本 Sprint 的价值产出）
      2. **Epic / Story 拆分**：每个 Story 包含
         - 临时 ID（用 {{sprint_name}} 缩写做前缀，如 S1-1、S1-2 …，供后续 Jira 映射）
         - 标题（动词开头、可验收）
         - 用户故事描述（作为…我想…以便…）
         - 验收标准（Given/When/Then，至少 2 条）
         - 估点（故事点或人天）
         - 优先级（P0/P1/P2）
      3. **任务依赖关系**（哪些可并行、哪些有先后，标出关键路径）
      4. **产能校验**（总估点 vs 产能，是否超载，超载则给出砍/挪建议）
      5. **本 Sprint 不做的事**（明确 out-of-scope，防止范围蔓延）
      6. **待澄清问题**（需要用户在 Review 阶段拍板的开放项）
    depends_on: [requirement_alignment]
    output: sprint_backlog

  - id: story_grill
    role: "product/product-manager"
    task: |
      对 sprint_planning 产出的**每一个 Story 逐个**用 grill-me 方法论对齐——
      不要整批粗对付。这份产物的最终执行者是 OpenCode（AI 编码代理），它不会追问、
      会忠实实现每一个含糊的 Story；逐 Story 逼到共识是这条流水线最关键的防错门。

      ## Sprint Backlog（待逐个 grill 的 Story 列表）
      {{sprint_backlog}}

      ## 需求对齐纪要（sprint 级基准）
      {{aligned_requirements}}

      执行方式（遵循 grill-me skill，对每个 Story 独立走一遍）：
      1. **一次一个 Story、一次一个问题**，沿该 Story 的决策树逐个分支敲定，按依赖顺序推进。
      2. **每个问题都给出推荐答案**（基于产品+技术判断），让用户确认或纠正，而非开放式空问。
      3. **能从代码库/现有产物查到的先自己查**（读 P0 现有实现、相关模块、`docs/adr/`、上一 Sprint 产物），
         不拿已知信息问用户。代码已能回答的，直接把结论写进该 Story，不要浪费用户一次确认。
      4. 逐 Story 重点逼问：成功判据、范围边界（做/不做）、隐含假设、边界与异常、
         与现有代码或其他 Story 的冲突（尤其是会推翻已定决策/ADR 的现状）。
      5. 每个 Story 对齐到共识后，**立即用 to-prd skill 的 PRD 结构定稿该 Story**，至少含：
         问题陈述 / 目标与成功指标 / 方案概述 / 技术考量(接口契约、数据模型、依赖) / 开放项，
         并**必须包含下面这组「OpenCode 执行契约」字段**——它们是下游 task-development.yaml 的 `read_ticket`
         步骤会逐条解析的字段，缺任一个 OpenCode 会停下报错（见该工作流 read_ticket 的 HARD-GATE）：
         - **Summary**：一句英文祈使句（OpenCode commit message 来源）。
         - **验收标准 (AC)**：逐条 Given-When-Then，可写成自动化断言。
         - **Files to touch**：**具体文件/目录路径清单**（不是模块名），OpenCode 只能改这些；新建文件也要列出预期路径。
         - **Out of scope**：明确不实现的内容。
         - **关键实现步骤 (Steps)**：有序步骤，OpenCode 可逐条执行。
         - **Verification commands**：**可直接运行的命令**（如 `mvn -pl <module> test`、`pnpm --filter <pkg> test`、具体 curl/脚本），不是"写测试"这类描述。

      <HARD-GATE>
      1) 每个 Story 都必须单独 grill 到共识才定稿，**不得跳过、不得整批合并 grill**。
         仍有影响实现的关键分歧未解决时，不得进入 tech_spec。
      2) 定稿的每个 Story PRD **只写入本地文件**：`.ao-output/<sprint_name>-<date>/stories/<临时ID>.md`，
         一个 Story 一个文件，并维护一个 `stories/INDEX.md` 汇总临时 ID ↔ 标题 ↔ 估点 ↔ 文件路径。
      3) **本步骤、以及本工作流的任何步骤，一律禁止调用 Jira/Atlassian MCP、禁止创建或更新任何 Jira issue。**
         grill 之后只改本地产物。Jira 写入（含建 Epic 串联 Story）是 sprint-jira-sync.yaml 在用户批准后的独占职责，
         这是审批与执行之间的硬边界——擅自建 Jira 属于越界。
      4) 每个 Story 的本地产物必须包含以下固定标题，缺一视为失败：
         - Summary
         - 验收标准（AC）
         - Files to touch
         - Out of scope
         - 关键实现步骤 (Steps)
         - Verification commands
      </HARD-GATE>

      输出「逐 Story 对齐结果」：每个 Story 的 PRD 定稿正文 + 本地文件路径 + INDEX 汇总。
    depends_on: [sprint_planning]
    output: story_prds

  - id: tech_spec
    role: "engineering/engineering-software-architect"
    task: |
      请基于**逐 Story 已 grill 定稿的 PRD**，为本 Sprint 的每个 Story 编写可落地的 Tech Spec。
      这份 Spec 的最终读者是 OpenCode（AI 编码代理），必须明确到它能直接照着实现，不留模糊地带。
      Tech Spec 按 Story 分节追加进各 Story 的本地 PRD 文件（`.ao-output/<sprint_name>-<date>/stories/<临时ID>.md`），
      不写 Jira、不放别处——批准后由 sprint-jira-sync.yaml 把含 Tech Spec 的完整 Story 正文灌进 Jira issue description。

      ## 逐 Story 已 grill 定稿的 PRD（权威输入）
      {{story_prds}}

      ## Sprint Backlog（估点/依赖参考）
      {{sprint_backlog}}

      ## 技术背景
      {{tech_context}}

      把 Tech Spec **按 Story 追加进各 Story 的本地 PRD 文件对应小节**，每个 Story 必须以其临时 ID 为小节标题，包含：
      1. **实现概述**（这个 Story 的技术实现思路，一段话）
      2. **Files to touch**（**具体文件/目录路径清单**，OpenCode 只能改这些；新增文件列预期路径——这是 read_ticket 必读字段，缺则 OpenCode 停）
      3. **接口契约**（API：URL、Method、请求/响应示例；或函数签名）
      4. **数据模型变更**（新增/修改的表或字段、迁移脚本要点、索引）
      5. **关键实现步骤 (Steps)**（有序步骤，OpenCode 可逐条执行）
      6. **边界与异常处理**（错误码、校验、并发/幂等要求）
      7. **Verification commands**（**可直接运行的验证命令**，如 `mvn -pl <module> test` / `pnpm --filter <pkg> test` / curl，对应验收标准——这是 read_ticket 必读字段，缺则 OpenCode 停）
      8. **依赖与前置条件**（依赖哪些 Story 先完成、需要的环境/配置）

      注：以上 Files to touch / Out of scope（在 PRD 中已有）/ 验收标准(AC) / Verification commands
      四项是 task-development.yaml `read_ticket` 的强制契约字段，每个 Story 都必须齐全且可执行。

      额外输出：
      - **全局技术决策**（本 Sprint 跨 Story 的统一约定：命名、目录结构、复用组件）
      - **风险与未决项**（实现层面需要 Review 阶段确认的技术选择）
    depends_on: [story_grill]
    output: tech_spec_doc

  - id: spec_lint
    role: "engineering/engineering-code-reviewer"
    task: |
      你是 Spec 质检员。这份 Tech Spec 的执行者是 AI 编码代理（OpenCode），它不会追问、
      会忠实实现一切模糊之处。请逐 Story 审查，确保 Spec 没有让 AI 跑偏的洞。

      ## Sprint Backlog（含全部 Story 与验收标准）
      {{sprint_backlog}}

      ## Tech Spec
      {{tech_spec_doc}}

      请输出「Spec 质检报告」：
      1. **覆盖度核对**：列出 Backlog 中所有 Story 临时 ID，逐一标注 Spec 是否覆盖
         （✅ 已覆盖 / ❌ 缺失 / ⚠️ 仅部分覆盖）。任何 ❌ 都是阻塞项。
      2. **歧义扫描**：逐条揪出 AI 杀手级模糊表述，并给出原文位置与建议改法，包括但不限于：
         - 模糊词："等/类似/参考现有做法/视情况/酌情/合理地"
         - 接口契约缺失或只写了名字没写出入参/响应/错误码
         - 验收标准不可测（无法写成自动化断言）
         - 数据变更缺迁移/回滚说明或索引
         - 残留 TODO / 占位符 / "待补充"
      3. **一致性检查**：接口/数据模型/命名在跨 Story 间是否冲突；依赖关系是否成环或缺失前置。
      4. **测试可验证性**：每个 Story 的测试要求能否对应到其验收标准，缺口列出。
      5. **结论**：
         - 🔴 阻塞项清单（必须修复后才能进入审批）
         - 🟡 建议项清单（不阻塞，但批准时应知悉）
         - 一句话总评：[可进入审批 / 需先修复阻塞项]

      只做质检，不要改写 Spec 本身。
    depends_on: [tech_spec]
    output: spec_review

  - id: decision_record
    role: "engineering/engineering-software-architect"
    task: |
      从需求对齐与技术方案中提炼本 Sprint 的关键决策，草拟为 ADR（架构决策记录），
      供批准后落库 `docs/adr/`，让下个 Sprint 不必重新扯皮。只记**非显然**的决策，别记从代码/常识可推导的东西。

      ## 需求对齐纪要（grill 敲定的产品决策）
      {{aligned_requirements}}

      ## Tech Spec（含全局技术决策与未决项）
      {{tech_spec_doc}}

      ## Spec 质检报告
      {{spec_review}}

      请输出「决策记录草案」：先列一份决策清单，再为每条值得记录的决策给出 ADR 草稿，格式：
      ```
      # ADR-<待批准后编号>: <决策标题>
      - 状态: 提议（待 Sprint 批准后置为 Accepted）
      - 背景: 为什么需要做这个决策（问题/约束）
      - 决策: 选了什么
      - 备选方案: 还考虑过什么，为什么没选
      - 影响: 带来的好处与代价/限制
      - 关联: {{sprint_name}} / 相关 Story 临时 ID
      ```
      筛选标准：架构/技术选型、跨 Story 的统一约定、有 tradeoff 的产品取舍、影响后续 Sprint 的约束才记。
      显而易见或可逆的小决定不记。
    depends_on: [spec_lint]
    output: decision_draft

  - id: review_gate
    role: "project-management/project-management-project-shepherd"
    task: |
      你现在是 Review 协调人。把 Sprint Backlog、Tech Spec、Spec 质检报告和决策记录草案整合成一份「待审批包」，
      呈现给用户做人工 Review，并**强制暂停**等待用户明确批准。

      ## Sprint Backlog
      {{sprint_backlog}}

      ## Tech Spec
      {{tech_spec_doc}}

      ## Spec 质检报告
      {{spec_review}}

      ## 决策记录草案（ADR，批准后落 docs/adr/）
      {{decision_draft}}

      请输出「{{sprint_name}} 待审批包」：
      1. **一页纸摘要**：Sprint 目标、Story 数量、总估点、关键路径、主要风险
      2. **质检结论前置**：把质检报告里的 🔴 阻塞项和 🟡 建议项摆在最显眼处
      3. **完整 Story 列表**（含验收标准与估点，便于逐条审）
      4. **Tech Spec 要点对照表**（Story ↔ 改动范围 ↔ 接口/数据变更）
      5. **需用户拍板的开放项清单**（编号列出，每项给出 A/B 推荐选项）
      6. **决策记录草案（ADR）**：列出批准后将落 `docs/adr/` 的决策标题，附草稿
      7. **同步预案**：批准后由 sprint-jira-sync.yaml 在 Jira 项目 {{jira_project}} 执行——
         先建 1 个 **Epic**（本 Sprint），所有 Story 的 `parent` 设为该 Epic（**Epic 串联 Story**）；
         每个 Story 的**完整 Tech Spec 必须写入 Story 的 description 正文**（OpenCode 从 Jira ticket 读取，
         **不得用附件或外部链接**，否则 OpenCode 取不到导致信息丢失）；ADR 写入 `docs/adr/`（随仓库提交，跨 Sprint 记忆）。
         本地 `.ao-output/.../stories/*.md` 仅作暂存，真正交给 OpenCode 的事实源是 Jira ticket。

      <HARD-GATE>
      1) 若质检报告存在 🔴 阻塞项，必须先提示"存在阻塞项，建议修复后再批准"，
         并明确询问用户是带病批准还是先修复。不得自行忽略阻塞项。
      2) 输出待审批包后，必须停止工作流，明确向用户提出：
         "以上为 {{sprint_name}} 待审批包，请 Review。确认无误请回复『批准』，
          随后运行 sprint-jira-sync.yaml 完成 Jira 同步；如需修改请直接指出
          （哪个 Story / 哪条 Spec / 哪个开放项怎么定）。"
      3) 本工作流到此结束，**不执行任何 Jira 写入、也不写 docs/adr/**。Jira 同步与 ADR 落库
         都是独立工作流（sprint-jira-sync.yaml）的事，由用户在批准后手动触发——这是审批与执行之间的硬边界。
      </HARD-GATE>
      本步骤本地产物与格式硬约束：
      1. 必须落盘 `.ao-output/<sprint_name>-<date>/approval_bundle.md`
      2. 必须严格遵循模板 `vendor/workflows/templates/sprint-plan-review/approval_bundle.md`
      3. 必须明确标注“待审批，未同步 Jira”
      4. 本工作流结束前必须通过 `scripts/validate-sprint-plan-review-output.ps1`
    depends_on: [decision_record]
    output: review_package
