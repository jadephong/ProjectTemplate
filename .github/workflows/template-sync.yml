name: Template Sync Notifier

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  notify-sync:
    name: Notify downstream repos for template sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get template version
        id: version
        run: |
          VERSION=$(git describe --tags --always --abbrev=7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Changed files:"
          git diff HEAD~1..HEAD --name-only || echo "First commit"

      - name: Find downstream repos with topic
        id: repos
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          REPOS=$(gh search repos "topic:jadep-template user:jadephong" --json nameWithOwner --jq '.[].nameWithOwner')
          echo "repos=$REPOS" >> $GITHUB_OUTPUT
          echo "Found repos:"
          echo "$REPOS"

      - name: Open sync issues in downstream repos
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPOS="${{ steps.repos.outputs.repos }}"

          while IFS= read -r repo; do
            if [ -z "$repo" ]; then continue; fi

            echo "Opening issue in $repo..."

            CHANGED_FILES=$(git diff HEAD~1..HEAD --name-only | paste -sd ',' - || echo "See template commit $VERSION")

            ISSUE_TITLE="chore: sync template $VERSION"
            ISSUE_BODY=$(printf 'Template has been updated. Please run `copier update` to sync.\n\n## Changed Files\n%s\n\n## Steps\n1. Review: `copier diff`\n2. Apply: `copier update`\n3. Commit and push\n\nTemplate: %s\nRepository: %s/%s/commit/%s' \
              "$CHANGED_FILES" \
              "$VERSION" \
              "${{ github.server_url }}" \
              "${{ github.repository }}" \
              "${{ github.sha }}")

            # Check if issue already exists
            EXISTING=$(gh issue list --repo "$repo" --search "$ISSUE_TITLE" --state open --json number --jq '.[0].number' || echo "")

            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$repo" --title "$ISSUE_TITLE" --body "$ISSUE_BODY" || echo "Could not create issue"
            else
              echo "Issue #$EXISTING already exists, skipping"
            fi
          done <<< "$REPOS"

      - name: Summary
        run: |
          echo "✅ Template sync notifications sent"
          echo "Template version: ${{ steps.version.outputs.version }}"
